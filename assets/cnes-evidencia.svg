<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">Parte 4 do CNES em Evidência</title>
  <desc id="desc">Resumo dos 124.459 registros de equipes de saúde na competência setembro de 2026, com taxa nacional de 58 equipes por 100 mil habitantes e 40 tipos informados.</desc>
  <rect width="1000" height="630" fill="#f7f5ef"/>
  <rect x="48" y="42" width="904" height="546" rx="8" fill="#fffefa" stroke="#b7c1bd" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <rect x="78" y="70" width="166" height="38" rx="19" fill="#edf2ef"/>
    <text x="94" y="95" fill="#55635e" font-size="13" font-weight="700">1 · Qualidade cadastral</text>
    <rect x="256" y="70" width="194" height="38" rx="19" fill="#edf2ef"/>
    <text x="272" y="95" fill="#55635e" font-size="13" font-weight="700">2 · Presença por população</text>
    <rect x="462" y="70" width="200" height="38" rx="19" fill="#edf2ef"/>
    <text x="478" y="95" fill="#55635e" font-size="13" font-weight="700">3 · Capacidade hospitalar</text>
    <rect x="674" y="70" width="228" height="38" rx="19" fill="#176b52"/>
    <text x="691" y="95" fill="#ffffff" font-size="13" font-weight="700">4 · Equipes de saúde</text>

    <text x="78" y="158" fill="#17221f" font-size="40" font-weight="700">Equipes de saúde por UF</text>
    <text x="78" y="190" fill="#55635e" font-size="19">Registros ativos do CNES na competência 09/2026</text>

    <g>
      <rect x="78" y="226" width="194" height="108" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="96" y="255" fill="#55635e" font-size="14">Equipes cadastradas</text>
      <text x="96" y="301" fill="#17221f" font-size="32" font-weight="700">124.459</text>
    </g>
    <g>
      <rect x="288" y="226" width="194" height="108" rx="6" fill="#edf6f1" stroke="#b9d2c6"/>
      <text x="306" y="255" fill="#55635e" font-size="14">Equipes por 100 mil</text>
      <text x="306" y="301" fill="#176b52" font-size="32" font-weight="700">58</text>
    </g>
    <g>
      <rect x="498" y="226" width="194" height="108" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="516" y="255" fill="#55635e" font-size="14">UFs reconciliadas</text>
      <text x="516" y="301" fill="#17221f" font-size="32" font-weight="700">27</text>
    </g>
    <g>
      <rect x="708" y="226" width="194" height="108" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="726" y="255" fill="#55635e" font-size="14">Tipos presentes</text>
      <text x="726" y="301" fill="#17221f" font-size="32" font-weight="700">40</text>
    </g>

    <text x="78" y="382" fill="#17221f" font-size="19" font-weight="700">Tipos com mais registros</text>
    <text x="78" y="421" fill="#55635e" font-size="15">70 · ESF</text>
    <rect x="246" y="403" width="548" height="22" rx="4" fill="#2b716f"/>
    <text x="813" y="421" fill="#17221f" font-size="17" font-weight="700">57.585</text>
    <text x="78" y="464" fill="#55635e" font-size="15">71 · ESB</text>
    <rect x="246" y="446" width="423" height="22" rx="4" fill="#86aaa1"/>
    <text x="687" y="464" fill="#17221f" font-size="17" font-weight="700">44.404</text>

    <line x1="78" y1="505" x2="902" y2="505" stroke="#d1d8d4"/>
    <text x="78" y="540" fill="#17221f" font-size="16" font-weight="700">Limite da leitura</text>
    <text x="215" y="540" fill="#55635e" font-size="16">Registros de equipes não equivalem a profissionais ou atendimentos.</text>
    <text x="78" y="566" fill="#6b7a75" font-size="13">CNES Equipes + estimativa populacional do IBGE · competência 09/2026</text>
  </g>
</svg>
