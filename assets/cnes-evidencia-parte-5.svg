<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">Parte 5 do CNES em Evidência</title>
  <desc id="desc">Resumo dos 1.060.015 registros de serviço e classificação na competência setembro de 2026, distribuídos pelas 27 unidades federativas e 342 classificações.</desc>
  <rect width="1000" height="630" fill="#f7f5ef"/>
  <rect x="48" y="42" width="904" height="546" rx="8" fill="#fffefa" stroke="#b7c1bd" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="78" y="88" fill="#176b52" font-size="13" font-weight="700" letter-spacing="1.5">CNES EM EVIDÊNCIA · PARTE 5</text>
    <text x="78" y="142" fill="#17221f" font-size="39" font-weight="700">Serviços registrados no CNES</text>
    <text x="78" y="176" fill="#55635e" font-size="18">Competência 09/2026 · contagens reconciliadas antes da publicação</text>
    <g>
      <rect x="78" y="212" width="194" height="100" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="96" y="240" fill="#55635e" font-size="14">Registros</text>
      <text x="96" y="283" fill="#17221f" font-size="31" font-weight="700">1.060.015</text>
    </g>
    <g>
      <rect x="288" y="212" width="194" height="100" rx="6" fill="#edf6f1" stroke="#b9d2c6"/>
      <text x="306" y="240" fill="#55635e" font-size="14">Por 100 mil habitantes</text>
      <text x="306" y="283" fill="#176b52" font-size="31" font-weight="700">495</text>
    </g>
    <g>
      <rect x="498" y="212" width="194" height="100" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="516" y="240" fill="#55635e" font-size="14">UFs reconciliadas</text>
      <text x="516" y="283" fill="#17221f" font-size="31" font-weight="700">27</text>
    </g>
    <g>
      <rect x="708" y="212" width="194" height="100" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="726" y="240" fill="#55635e" font-size="14">Classificações</text>
      <text x="726" y="283" fill="#17221f" font-size="31" font-weight="700">342</text>
    </g>
    <text x="78" y="360" fill="#17221f" font-size="18" font-weight="700">Classificações com mais registros</text>
    <text x="78" y="400" fill="#55635e" font-size="14">174001 · Imunização</text>
    <rect x="316" y="383" width="410" height="22" rx="4" fill="#2b716f"/>
    <text x="746" y="400" fill="#17221f" font-size="16" font-weight="700">43.437</text>
    <text x="78" y="440" fill="#55635e" font-size="14">159004 · Saúde da Família</text>
    <rect x="316" y="423" width="383" height="22" rx="4" fill="#628f84"/>
    <text x="719" y="440" fill="#17221f" font-size="16" font-weight="700">40.567</text>
    <text x="78" y="480" fill="#55635e" font-size="14">159005 · Saúde Bucal</text>
    <rect x="316" y="463" width="352" height="22" rx="4" fill="#91aca5"/>
    <text x="688" y="480" fill="#17221f" font-size="16" font-weight="700">37.275</text>
    <line x1="78" y1="515" x2="902" y2="515" stroke="#d1d8d4"/>
    <text x="78" y="547" fill="#17221f" font-size="15" font-weight="700">Limite da leitura</text>
    <text x="213" y="547" fill="#55635e" font-size="15">Cadastro não comprova atendimento, disponibilidade ou produção.</text>
    <text x="78" y="572" fill="#6b7a75" font-size="13">CNES Serviços + estimativa populacional do IBGE · série em construção</text>
