<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">Parte 6 do CNES em Evidência</title>
  <desc id="desc">Série mensal de leitos cadastrados no CNES entre janeiro e setembro de 2026, com nove competências validadas.</desc>
  <rect width="1000" height="630" fill="#f7f5ef"/>
  <rect x="48" y="42" width="904" height="546" rx="8" fill="#fffefa" stroke="#b7c1bd" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="78" y="88" fill="#176b52" font-size="13" font-weight="700" letter-spacing="1.5">CNES EM EVIDÊNCIA · PARTE 6</text>
    <text x="78" y="142" fill="#17221f" font-size="39" font-weight="700">Leitos ao longo das competências</text>
    <text x="78" y="176" fill="#55635e" font-size="18">Janeiro a setembro de 2026 · cada mês validado separadamente</text>

    <g>
      <rect x="78" y="212" width="250" height="100" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="96" y="240" fill="#55635e" font-size="14">Leitos em 01/2026</text>
      <text x="96" y="283" fill="#17221f" font-size="31" font-weight="700">521.602</text>
    </g>
    <g>
      <rect x="344" y="212" width="250" height="100" rx="6" fill="#edf6f1" stroke="#b9d2c6"/>
      <text x="362" y="240" fill="#55635e" font-size="14">Leitos em 09/2026</text>
      <text x="362" y="283" fill="#176b52" font-size="31" font-weight="700">524.000</text>
    </g>
    <g>
      <rect x="610" y="212" width="292" height="100" rx="6" fill="#f4f7f5" stroke="#d7dfdb"/>
      <text x="628" y="240" fill="#55635e" font-size="14">Competências reconciliadas</text>
      <text x="628" y="283" fill="#17221f" font-size="31" font-weight="700">9</text>
    </g>

    <text x="78" y="354" fill="#17221f" font-size="18" font-weight="700">Evolução do total cadastrado</text>
    <line x1="90" y1="491" x2="892" y2="491" stroke="#d7dfdb"/>
    <line x1="90" y1="388" x2="90" y2="491" stroke="#d7dfdb"/>
    <polyline points="96,440 195,469 294,481 393,451 492,457 590,399 689,403 788,395 887,370" fill="none" stroke="#176b52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fffefa" stroke="#176b52" stroke-width="3">
      <circle cx="96" cy="440" r="6"/><circle cx="195" cy="469" r="6"/>
      <circle cx="294" cy="481" r="6"/><circle cx="393" cy="451" r="6"/>
      <circle cx="492" cy="457" r="6"/><circle cx="590" cy="399" r="6"/>
      <circle cx="689" cy="403" r="6"/><circle cx="788" cy="395" r="6"/>
      <circle cx="887" cy="370" r="6"/>
    </g>
    <text x="90" y="513" fill="#6b7a75" font-size="12">01/2026</text>
    <text x="839" y="513" fill="#6b7a75" font-size="12">09/2026</text>
    <line x1="78" y1="531" x2="902" y2="531" stroke="#d1d8d4"/>
    <text x="78" y="559" fill="#17221f" font-size="15" font-weight="700">Como ler</text>
    <text x="158" y="559" fill="#55635e" font-size="15">Variação cadastral não equivale a melhora ou piora assistencial.</text>
  </g>
</svg>
